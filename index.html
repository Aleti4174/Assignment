
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Expense Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <div class="container py-5">

        <h1 class="text-center text-primary mb-4">
            My Expense Tracker
        </h1>

        <!-- Expense Form -->
        <div class="card shadow mb-4">

            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Add Expense</h4>
            </div>

            <div class="card-body">

                <form id="expense-form">

                    <div class="mb-3">
                        <label for="amount" class="form-label">
                            Amount
                        </label>

                        <input
                            type="number"
                            id="amount"
                            class="form-control"
                            placeholder="Enter amount"
                            min="0.01"
                            step="0.01"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">
                            Description
                        </label>

                        <input
                            type="text"
                            id="description"
                            class="form-control"
                            placeholder="Enter description"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="category" class="form-label">
                            Category
                        </label>

                        <select id="category" class="form-select" required>
                            <option value="">Select Category</option>
                            <option value="Food">Food</option>
                            <option value="Travel">Travel</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <button
                        type="submit"
                        id="submit-btn"
                        class="btn btn-primary w-100"
                    >
                        Add Expense
                    </button>

                    <button
                        type="button"
                        id="cancel-btn"
                        class="btn btn-secondary w-100 mt-2 d-none"
                    >
                        Cancel Edit
                    </button>

                </form>

            </div>
        </div>

        <!-- Total Expenses -->
        <div class="card bg-success text-white mb-4 shadow">

            <div class="card-body text-center">

                <h5>Total Expenses</h5>

                <h2>
                    ₹<span id="total-expenses">0.00</span>
                </h2>

            </div>
        </div>

        <!-- Expense Table -->
        <div class="card shadow">

            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">Expense History</h4>
            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-bordered table-hover text-center">

                        <thead class="table-primary">
                            <tr>
                                <th>Amount</th>
                                <th>Description</th>
                                <th>Category</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="expense-list"></tbody>

                    </table>

                </div>

                <p id="empty-message" class="text-center text-muted">
                    No expenses added yet.
                </p>

            </div>
        </div>

    </div>

    <script src="index.js"></script>

</body>
</html>
